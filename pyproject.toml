[project]
name = "syzbot-mcp"
version = "0.1.0"
description = "MCP server that fetches and explains syzbot Linux kernel bug reports - KASAN, KCSAN, lockdep, WARNING, UBSAN, oops, hung tasks - with symbolized stacks and plain-English summaries."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0"]
keywords = ["mcp", "syzbot", "syzkaller", "linux-kernel", "kasan", "fuzzing", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Operating System Kernels :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/syzbot-mcp"

[project.scripts]
syzbot-mcp = "syzbot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syzbot_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
